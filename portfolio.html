    <header class="case-heading"><p class="eyebrow">Graphic Design <span></span> Concept Project</p><h1>Afterglow Coffee</h1><p>A coffee identity built for slow mornings.</p></header>
    <div class="case-lead" style="--tone:#edd3c5"><div class="cover coffee-cover"><img class="" data-asset="coffee.webp" alt="Afterglow coffee bag mockup with an espresso cup" loading="lazy" width="510" height="339"><div class="coffee-mock-label"><span aria-hidden="true" class="sun-mark"><i></i><i></i><i></i></span><strong>Afterglow</strong><span>HOUSE BLEND</span></div><div class="coffee-mock-label coffee-back"><strong>Afterglow</strong><span>DECAF</span></div></div></div>
    <section class="case-overview"><div><p class="eyebrow">Specialty coffee identity</p><h2>The brief</h2><p>Create a specialty coffee identity that feels warm enough for a neighbourhood café and distinct enough to recognize on a retail shelf.</p><h3>Intended outcome</h3><p>Build recognition across retail bags and café materials while keeping roast details easy to read.</p></div>
    <dl><dt>Audience</dt><dd>Home brewers and café regulars drawn to approachable specialty coffee.</dd><dt>Design role</dt><dd>Art direction, wordmark and symbol, palette, typography, packaging and menu design.</dd><dt>Deliverables</dt><dd><ul><li>Primary wordmark and stand-alone sun mark</li><li>Palette and typography</li><li>Coffee bag mockup and flat label</li><li>Café menu sample</li></ul></dd></dl></section>

    <section class="case-section decision-section"><h2>Design decisions</h2><div class="decision-grid"><article><span>01</span><h3>Build around the rising sun</h3><p>A circle and three horizon lines echo the name and create a simple mark that can work at the size of a bag sticker.</p></article><article><span>02</span><h3>Create a dependable label order</h3><p>The blend title, tasting notes and weight use the same placement so future roasts can join the range.</p></article><article><span>03</span><h3>Pair warmth with strong contrast</h3><p>Espresso burgundy and peach feel inviting, and a pale menu background keeps prices and item names clearly readable.</p></article></div></section>

    <header class="case-heading"><p class="eyebrow">Graphic Design <span></span> Concept Project</p><h1>Daylight Skin</h1><p>A visible order for a daily routine.</p></header>
    <div class="case-lead" style="--tone:#e1e4f1"><div class="cover skin-cover"><img class="" data-asset="skin.webp" alt="Daylight Skin container and carton mockup on a stone plinth" loading="lazy" width="510" height="339"><i class="skin-print skin-print-a">DAYLIGHT<br>02</i><i class="skin-print skin-print-b">DAYLIGHT<br>01</i><i class="skin-print skin-print-c">DAYLIGHT<br>03</i><i class="skin-print skin-print-d">DAYLIGHT<br>02</i></div></div>
    <section class="case-overview"><div><p class="eyebrow">Skincare packaging collection</p><h2>The brief</h2><p>Design a three-product skincare collection with a shared front-label hierarchy and a distinct visual cue for each formula.</p><h3>Intended outcome</h3><p>Make cleanser, serum and moisturiser easy to distinguish on shelf or in a product lineup.</p></div>
    <dl><dt>Audience</dt><dd>Skincare shoppers looking for a straightforward, everyday routine.</dd><dt>Design role</dt><dd>Packaging art direction, label system, starter carton and mockup composition.</dd><dt>Deliverables</dt><dd><ul><li>Three product labels</li><li>Serum carton layout</li><li>Product lineup mockup</li><li>Colour and hierarchy system</li></ul></dd></dl></section>
    <section class="case-section artwork-section"><h2>Artwork in detail</h2><div class="artwork-grid"><figure class="piece wide"><div class="flat skin-labels"><div class="skin-label mint"><b>DAYLIGHT</b><span>01 / Cleanse</span><h3>Daily gel cleanser</h3><small>150 ml</small></div><div class="skin-label cobalt"><b>DAYLIGHT</b><span>02 / Treat</span><h3>Daily face serum</h3><small>30 ml</small></div><div class="skin-label oat"><b>DAYLIGHT</b><span>03 / Moisturise</span><h3>Daily barrier cream</h3><small>50 ml</small></div></div><figcaption>Flat label system · three formulas</figcaption></figure><figure class="piece wide"><div class="flat skin-carton"><div class="skin-label cobalt"><b>DAYLIGHT</b><span>02 / Treat</span><h3>Daily face serum</h3><small>30 ml</small></div><aside><b>THE DAILY ROUTINE</b><p>Apply after cleansing. Follow with moisturiser.</p><small>30 ml</small></aside></div><figcaption>Serum carton · front and side</figcaption></figure></div><div class="palette"><h3>Palette &amp; type</h3><ul><li><i style="--swatch:#233cad"></i><span>Cobalt<small>#233CAD</small></span></li><li><i style="--swatch:#cbe2d4"></i><span>Mint<small>#CBE2D4</small></span></li><li><i style="--swatch:#f1e8d2"></i><span>Oat<small>#F1E8D2</small></span></li><li><i style="--swatch:#232543"></i><span>Ink<small>#232543</small></span></li></ul><p>Label hierarchy · wordmark, routine step, formula and volume.</p></div></section>
    <section class="case-section decision-section"><h2>Design decisions</h2><div class="decision-grid"><article><span>01</span><h3>Repeat the information hierarchy</h3><p>The wordmark, routine step, formula name and volume occupy the same positions on all labels.</p></article><article><span>02</span><h3>Use two cues to distinguish formulas</h3><p>Mint, cobalt and oat separate the range visually. Step numbers and names carry the same distinction when colours are harder to tell apart.</p></article><article><span>03</span><h3>Keep the carton consistent with the bottle</h3><p>The carton repeats the step number and product name on the front, with application instructions on the side.</p></article></div></section>

arge serif for story-led pages and a consistent sans-serif detail grid.</p></div></section>

const conceptScript = "const params = new URLSearchParams(portableSearch);\nif (params.get(\"embed\") === \"1\") document.body.classList.add(\"embed\");\n\nconst room = params.get(\"room\");\nif (room === \"garden\") {\n  for (const display of document.querySelectorAll(\"[data-room]\")) {\n    display.hidden = display.dataset.room !== room;\n  }\n}\n\nfor (const select of document.querySelectorAll(\"select\")) {\n  const selection = params.get(select.name);\n  if (selection && [...select.options].some(option => option.value === selection)) {\n    select.value = selection;\n  }\n}\n\nfor (const form of document.querySelectorAll(\"[data-demo-form]\")) {\n  const steps = [...form.querySelectorAll(\"fieldset\")];\n  const summary = form.querySelector(\".form-status\");\n  let current = 0;\n\n  function showStep(index, focus) {\n    current = index;\n    steps.forEach((step, stepIndex) => {\n      step.hidden = stepIndex !== index;\n      step.disabled = stepIndex !== index;\n    });\n    if (focus) steps[index].querySelector(\"input, select\")?.focus();\n  }\n\n  showStep(0, false);\n  form.addEventListener(\"click\", event => {\n    if (event.target.closest(\".back-step\")) showStep(current - 1, true);\n  });\n  form.addEventListener(\"submit\", event => {\n    event.preventDefault();\n    if (current \u003c steps.length - 1) {\n      showStep(current + 1, true);\n      return;\n    }\n    const checkIn = form.elements.namedItem(\"Check-in\");\n    const checkOut = form.elements.namedItem(\"Check-out\");\n    if (checkIn && checkOut && checkOut.value \u003c= checkIn.value) {\n      checkOut.setCustomValidity(\"Choose a check-out date after check-in.\");\n      checkOut.reportValidity();\n      return;\n    }\n    const values = [...form.querySelectorAll(\"input, select, textarea\")];\n    const title = document.createElement(\"h2\");\n    title.textContent = form.dataset.result;\n    const details = document.createElement(\"dl\");\n    for (const input of values) {\n      if (!input.value) continue;\n      const label = document.createElement(\"dt\");\n      label.textContent = input.closest(\"label\").querySelector(\"span\").textContent;\n      const value = document.createElement(\"dd\");\n      value.textContent = input.value;\n      details.append(label, value);\n    }\n    const note = document.createElement(\"p\");\n    note.textContent = \"This is a design preview. No request was sent.\";\n    const edit = document.createElement(\"button\");\n    edit.type = \"button\";\n    edit.className = \"action secondary\";\n    edit.textContent = \"Edit details\";\n    edit.addEventListener(\"click\", () => {\n      summary.hidden = true;\n      showStep(0, true);\n    });\n    steps[current].hidden = true;\n    summary.replaceChildren(title, details, note, edit);\n    summary.hidden = false;\n    summary.focus();\n  });\n  form.elements.namedItem(\"Check-out\")?.addEventListener(\"input\", event => event.target.setCustomValidity(\"\"));\n  form.elements.namedItem(\"Check-in\")?.addEventListener(\"input\", () => form.elements.namedItem(\"Check-out\")?.setCustomValidity(\"\"));\n}\n\nconst cartButton = document.querySelector(\".cart-button\");\ncartButton?.addEventListener(\"click\", () => {\n  document.querySelector(\".cart-status\").textContent = \"Opal Table Lamp added to your sample bag.\";\n  cartButton.disabled = true;\n  cartButton.textContent = \"Added to sample bag\";\n});\n";

const view = document.getElementById("portfolio-view");
const conceptStyle = document.getElementById("concept-style");
const allFrames = new Set();
let shownKey = "";
let shownSearch = "";

function routeFor(fragment) {
  const target = fragment.replace(/^#/, "");
  const [path, anchor = ""] = target.split("~", 2);
  const [key, search = ""] = path.split("?", 2);
  if ((key.startsWith("project/") || key.startsWith("design/")) && document.getElementById(key)) {
    return { key, search, anchor };
  }
  return { key: "home", search: "", anchor: target === "home" ? "top" : target };
}

function loadImages(scope) {
  for (const image of scope.querySelectorAll("img[data-asset]")) {
    const source = imageData[image.dataset.asset];
    if (source) image.src = source;
  }
}

function addFrame(frame) {
  const { key, search } = routeFor(frame.dataset.frame);
  const template = document.getElementById(key);
  if (!template) return;
  const fragment = template.content.cloneNode(true);
  loadImages(fragment);
  const el = document.createElement("div");
  el.append(fragment);
  const scriptBeginning = "<" + "script>";
  const scriptEnd = "</" + "script>";
  const frameNavigation = `
    document.addEventListener("click", (event) => {
      const link = event.target.closest('a[href^="#"]');
      if (!link) return;
      const fragment = link.getAttribute("href");
      if (!/^#(?:project|design)\\//.test(fragment)) return;
      event.preventDefault();
      parent.postMessage({type:"portfolio-route",fragment},"*");
    });`;
  const embeddedJS = `const portableSearch = ${JSON.stringify(search)};\n${conceptScript}\n${frameNavigation}`;
  const frameEnd = "</" + "body></" + "html>";
  frame.srcdoc = `<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>${conceptCSS}</style></head><body>${el.innerHTML}${scriptBeginning}${embeddedJS}${scriptEnd}${frameEnd}`;
  if (frame.contentWindow) allFrames.add(frame.contentWindow);
}

function setupSite() {
  const buttons = [...document.querySelectorAll("[data-filter]")];
const cards = [...document.querySelectorAll("[data-category]")];
const status = document.querySelector(".filter-status");

function updateFilter(filter) {
  let visible = 0;
  for (const card of cards) {
    card.hidden = filter !== "all" && card.dataset.category !== filter;
    if (!card.hidden) visible += 1;
  }
  for (const button of buttons) {
    button.setAttribute("aria-pressed", String(button.dataset.filter === filter));
  }
  if (status) status.textContent = `Showing ${visible} ${filter === "all" ? "" : filter + " design "}projects`;
}

for (const button of buttons) {
  button.addEventListener("click", () => updateFilter(button.dataset.filter));
}
for (const link of document.querySelectorAll("[data-filter-link]")) {
  link.addEventListener("click", () => updateFilter(link.dataset.filterLink));
}


}

function setupConcept(search) {
  const script = document.createElement("script");
  script.textContent = `{ const portableSearch = ${JSON.stringify(search)};\n${conceptScript}\n }`;
  view.append(script);
}

function render() {
  const { key, search, anchor } = routeFor(location.hash);
  if (key !== shownKey || search !== shownSearch) {
    const template = document.getElementById(key);
    const fragment = template.content.cloneNode(true);
    allFrames.clear();
    loadImages(fragment);
    view.replaceChildren(fragment);
    conceptStyle.media = key.startsWith("design/") ? "all" : "not all";
    if (key.startsWith("design/")) setupConcept(search);
    if (key === "home") setupSite();
    for (const frame of view.querySelectorAll("iframe[data-frame]")) addFrame(frame);
    const title = view.querySelector("h1")?.innerText?.replace(/\s+/g," ").trim();
    document.title = key==="home" ? "Web & Graphic Design Portfolio | Mangesh Chougule" : `${title} | Mangesh Chougule Portfolio`;
    shownKey = key;
    shownSearch = search;
    if (!anchor) window.scrollTo(0,0);
  }
  if (anchor) {
    requestAnimationFrame(() => document.getElementById(anchor)?.scrollIntoView());
  }
}

view.addEventListener("click", event => {
  const link = event.target.closest("a[href]");
  if (!link || shownKey === "home") return;
  const fragment = link.getAttribute("href");
  if (!fragment.startsWith("#") || !document.getElementById(fragment.slice(1))) return;
  event.preventDefault();
  const path = shownKey + (shownSearch ? "?" + shownSearch : "");
  location.hash = path + "~" + fragment.slice(1);
});

window.addEventListener("message", event => {
  if (!allFrames.has(event.source) || event.data?.type !== "portfolio-route") return;
  const target = event.data.fragment;
  if (typeof target !== "string" || !/^#(?:project|design)\//.test(target)) return;
  if (routeFor(target).key !== "home") location.hash = target;
});
window.addEventListener("hashchange", render);
render();
